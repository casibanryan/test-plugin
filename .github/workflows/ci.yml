name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: servers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: servers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Self-test the server entrypoint
        run: npm run selftest

  validate-plugin:
    name: Validate plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every JSON file parses
        run: |
          for f in .claude-plugin/plugin.json .mcp.json servers/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok  $f"
          done

      - name: plugin.json and the server agree on name and version
        run: |
          node -e "
            const fs = require('fs');
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('servers/package.json', 'utf8'));
            const fail = (m) => { console.error('FAIL: ' + m); process.exit(1); };
            if (!plugin.name) fail('plugin.json has no name');
            if (!/^\d+\.\d+\.\d+$/.test(plugin.version || '')) fail('plugin.json version is not semver: ' + plugin.version);
            if (plugin.version !== pkg.version) fail('version drift — plugin.json ' + plugin.version + ' vs servers/package.json ' + pkg.version);
            console.log('ok  ' + plugin.name + '@' + plugin.version);
          "

      - name: .mcp.json points at a file that exists
        run: |
          node -e "
            const fs = require('fs');
            const { mcpServers } = JSON.parse(fs.readFileSync('.mcp.json', 'utf8'));
            for (const [name, cfg] of Object.entries(mcpServers)) {
              const entry = (cfg.args || []).find((a) => a.includes('CLAUDE_PLUGIN_ROOT'));
              if (!entry) { console.log('skip  ' + name + ' (not a plugin-root launch)'); continue; }
              const rel = entry.replace('\${CLAUDE_PLUGIN_ROOT}/', '');
              if (!fs.existsSync(rel)) { console.error('FAIL: ' + name + ' -> missing ' + rel); process.exit(1); }
              console.log('ok  ' + name + ' -> ' + rel);
            }
          "

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Run the suite inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: greeting-plugin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the runtime image
        run: |
          docker run --rm greeting-plugin:ci --selftest | tee out.json
          node -e "
            const out = JSON.parse(require('fs').readFileSync('out.json', 'utf8'));
            if (!out.ok) { console.error('FAIL: selftest not ok'); process.exit(1); }
            if (out.tools.length !== 2) { console.error('FAIL: expected 2 tools, got ' + out.tools.length); process.exit(1); }
            console.log('ok  image serves ' + out.tools.join(', '));
          "

      - name: Image runs as a non-root user
        run: |
          test "$(docker run --rm --entrypoint id greeting-plugin:ci -un)" = "node"
