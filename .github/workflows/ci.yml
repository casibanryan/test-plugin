# .github/workflows/ci.yml
#
# Every push to main and every pull request. Deploys nothing and needs no cloud
# credentials, so it runs identically on a fork's pull request.
#
# All the actual checks live in _verify.yml, which CD calls as well — one definition of
# "is this good", rather than two that drift.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run still in flight. Safe here because CI
# changes nothing; CD deliberately does the opposite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  # A single required status check for branch protection. Without this, adding a job to
  # _verify.yml silently leaves it non-blocking until someone remembers to add it in
  # the repository settings.
  #
  # `if: always()` plus an explicit result test, because a skipped or cancelled
  # dependency leaves this job's default `success()` condition unmet in a way that
  # reads as green.
  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: verify
    if: always()
    steps:
      - name: Every verification job passed
        run: |
          echo "verify: ${{ needs.verify.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo '::error::verification did not pass'
            exit 1
          fi
