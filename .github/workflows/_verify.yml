# .github/workflows/_verify.yml
#
# Everything that can be proven without a deployed environment, as a reusable workflow.
#
# It exists so CI and CD run the SAME checks rather than two drifting copies. CD cannot
# simply trust that CI ran: a tag is permanent and installable, and it may point at a
# commit whose CI run predates a change to the workflow itself. So CD calls this again.

name: verify

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version for the single-version jobs.
        type: string
        default: '22'
      tag:
        description: Release tag being verified, if any. When set, the tag must match the repo version.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Runs first and alone, because everything else derives from the contract. If the
  # tool surface and its lock disagree, no other result means anything.
  # ---------------------------------------------------------------------------
  contract:
    name: Contract and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      # The cascade guard's first line: the committed digest must match what the source
      # computes. A tool surface cannot change without a reviewed lock diff.
      - name: The contract lock matches the source
        run: npm run contract:verify

      # Covers every package version, every plugin manifest, and every CHANNEL PIN —
      # so a partial resync (one channel updated, three forgotten) fails here.
      - name: Every version and channel pin agrees
        run: npm run versions:verify ${{ inputs.tag && format('-- --tag={0}', inputs.tag) || '' }}

      - name: Contract self-tests
        run: npm run test:contract

  # ---------------------------------------------------------------------------
  unit:
    name: Unit and integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: contract
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest Node still supported on the runners; 24 is what every
        # action's own runtime now uses. Both, because a suite that only ever ran on
        # one of them would hide a break on the other.
        #
        # NOT covered any more: the >=20.18.0 floor in every package.json. Node 20 is
        # end-of-life and its action runtime is deprecated, so nothing tests that
        # floor now. Either raise the floor to 22 or accept the gap knowingly — the
        # one thing to avoid is believing it is still checked.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci

      # Nothing to stand up first: no database, no upstream API, no port. The client
      # suite spawns the server as a child process, which is how a client runs it.
      - name: All workspace tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Every declared client, not just the plugin. The checks iterate the contract's
  # CLIENTS list, so adding a client automatically brings it under them.
  # ---------------------------------------------------------------------------
  clients:
    name: Client configs and channels
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      - name: The plugin manifest validates against the plugin schema
        run: npx --yes @anthropic-ai/claude-code plugin validate ./packages/clients/claude

      - name: Client configs, channel pins, and skills
        run: npm run clients:verify

      # Read-only: it must not repair the drift it is checking, or a pull request could
      # pass by rewriting the evidence.
      - name: Every client config is in sync with the channel manifest
        run: npm run clients:check -- --timeout-ms=5000

      - name: A marketplace install would get a working plugin
        run: |
          # A marketplace install copies the repo as-is: no npm install, no build. This
          # reproduces that and asserts the plugin's files stand on their own.
          mkdir -p /tmp/installed
          git archive HEAD | tar -x -C /tmp/installed
          cd /tmp/installed/packages/clients/claude
          for f in .claude-plugin/plugin.json .mcp.json skills hooks/hooks.json hooks/version-notice.js \
                   server/greeting-stdio.js server/greeting.js server/tools.json; do
            test -e "$f" || { echo "::error::$f is missing from a clean export"; exit 1; }
          done
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.mcp.json', 'utf8');
            const server = Object.values(JSON.parse(raw).mcpServers)[0];

            // No credential in either shape: the tools are read-only and anonymous.
            if (/authorization/i.test(raw)) { console.error('FAIL: an Authorization header was shipped'); process.exit(1); }
            const suspicious = raw.match(/\b[A-Za-z0-9_-]{32,}\b/g) || [];
            if (suspicious.length) { console.error('FAIL: something token-shaped was shipped: ' + suspicious[0]); process.exit(1); }

            if (server.type === 'stdio') {
              // The install directory is version-stamped, so an absolute path here
              // would work for exactly one release.
              const args = server.args || [];
              if (!server.command) { console.error('FAIL: a stdio server with no command'); process.exit(1); }
              if (!args.length) { console.error('FAIL: a stdio server with no args'); process.exit(1); }
              if (!args.some(a => a.includes('CLAUDE_PLUGIN_ROOT'))) {
                console.error('FAIL: the stdio server is not located through CLAUDE_PLUGIN_ROOT: ' + JSON.stringify(args));
                process.exit(1);
              }
              if (/https?:\/\//.test(raw)) { console.error('FAIL: a stdio config should carry no url'); process.exit(1); }
              console.log('ok  a clean install runs ' + server.command + ' ' + args.join(' ') + ', with no credential');
            } else if (server.type === 'http') {
              if (!/^https:\/\//.test(server.url)) { console.error('FAIL: shipped url is not https: ' + server.url); process.exit(1); }
              console.log('ok  a clean install points at ' + server.url + ', with no credential');
            } else {
              console.error('FAIL: unknown server type ' + server.type); process.exit(1);
            }
          "

          # The plugin's copy of the server has to run from the exported tree with no
          # npm install, which is the one thing a file-presence check cannot tell you.
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"greeting_hello","arguments":{"name":"CI","hour":9}}}' \
            | node server/greeting-stdio.js \
            | node -e "
              let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                const m = JSON.parse(s.trim().split('\n')[0]);
                if (m.result && m.result.isError) { console.error('FAIL: the shipped server refused a valid call: ' + m.result.content[0].text); process.exit(1); }
                if (!m.result || !m.result.structuredContent || m.result.structuredContent.ok !== true) {
                  console.error('FAIL: the shipped server did not answer: ' + s); process.exit(1);
                }
                console.log('ok  the shipped server answers from a clean export: ' + JSON.stringify(m.result.structuredContent.message));
              });
            "

  # ---------------------------------------------------------------------------
  # The dependency tree is the whole attack surface here: two workspaces of plain Node
  # with one runtime dependency between them. Production dependencies only — a
  # devDependency advisory is not a shipped risk, and failing on one would train
  # everyone to ignore this step.
  #
  # This job used to also package a deployable hub artifact, scan it, boot it from the
  # packaged tree and upload it for CD. There is no hub in this repository any more
  # (see docs/ARCHITECTURE.md); the equivalent proof for what actually ships now is the
  # clean-export check in the `clients` job above, which runs the plugin's own copy of
  # the server out of a `git archive` with no npm install.
  # ---------------------------------------------------------------------------
  audit:
    name: Scan the production dependency tree
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      - name: Vulnerability scan of the production dependency tree
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high | tee audit.txt || {
            echo '::error::npm audit found a high or critical advisory in a production dependency'
            exit 1
          }

  # ---------------------------------------------------------------------------
  # Both tiers. Tier 2 spawns every copy of the server and speaks JSON-RPC to it over a
  # pipe, exactly as a client does — including the copy inside the plugin, which is
  # what a marketplace install actually launches.
  # ---------------------------------------------------------------------------
  e2e-local:
    name: End-to-end (contract and protocol tiers)
    runs-on: ubuntu-latest
    needs: [unit, clients]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci

      - name: Both tiers, against every copy of the server
        run: npm run e2e
