# .github/workflows/cd.yml
#
# NO-AZURE MODE. The full channel ladder — dev slot, prerelease slot, approval gate,
# slot swap into production, rollback — is preserved verbatim on the `with-azure`
# branch and comes back by restoring that file. What is left is the half that actually
# reaches a user's machine, and it touches no cloud at all.
#
# THIS FILE HANDLES ONE TRIGGER: a push to main. The other two rungs are their own
# workflows — release.yml on a tag, bump.yml on a manual dispatch — and that split is
# deliberate.
#
# One workflow serving three triggers can only ever run a subset of its jobs, so every
# run reports a mix of green and grey and a reader has to know the `if:` conditions to
# tell an intended skip from a broken one. "Success, with three jobs skipped" is not a
# result anyone can act on. One workflow per trigger means every job in every run
# actually runs, and a green run is green all the way across.
#
# What a push to main does NOT do here, because both need a live hub to read:
#   * deploy anything
#   * `clients:sync-pin`, which reads the channel's /version — so channels.json keeps
#     the lastVerified records it has, rather than being advanced by a run that
#     deployed nothing
# The e2e tiers still run in _verify.yml, against a hub the suite starts itself.

name: CD

on:
  push:
    branches: [main]

# Never cancel in flight. Nothing here is destructive today, but the bump workflow
# pushes commits and the release workflow publishes, and a half-finished release is
# worse than a slow one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The same checks CI runs, from one definition rather than two that drift. Needs no
  # cloud credentials at all, which is why it survives Azure being removed.
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml

  # ---------------------------------------------------------------------------
  # What main serves now. No deploy and no gate — the record of what a marketplace
  # refresh would hand a user, so a green run says something checkable.
  live:
    name: Report what main serves
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: The plugin version on main
        run: |
          set -u
          marketplace=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'axle').version")
          plugin=$(node -p "require('./packages/clients/axle/.claude-plugin/plugin.json').version")

          # versions:verify already asserted this in the verify job. Repeated because
          # this is the one number a user's client compares against its cached copy to
          # decide an update exists, and a summary quoting a number that nothing
          # checked would be worse than no summary.
          if [ "$marketplace" != "$plugin" ]; then
            echo "::error::marketplace.json says $marketplace, plugin.json says $plugin"
            exit 1
          fi

          {
            echo "### axle $plugin"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$plugin\` |"
            echo "| commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| channel the shipped config points at | \`production\` |"
            echo ""
            echo "Clients tracking main get this on their next marketplace refresh. The hub"
            echo "itself is not deployed in no-Azure mode, so its tools will not answer."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ok  main serves axle $plugin at ${GITHUB_SHA:0:12}"
