# .github/workflows/cd.yml
#
# The channel ladder. One workflow, three rungs, three different triggers — which is
# the whole point of having four channels rather than one environment.
#
#   push to main   ──► dev          no gate. Redeployed continuously, so there is always
#                                   something live and newer than the last release.
#   tag v*.*.*     ──► prerelease   fully verified, then held at an approval.
#                  ──► production   a slot swap from prerelease, then verified again.
#
#   local                           your machine; never touched by this workflow.
#
# What each rung buys:
#
#   dev         catches "it works on my laptop but not on App Service" within minutes
#               of merging, with zero blast radius and nobody's approval.
#   prerelease  a full copy of what production is about to become, verified by the same
#               script that will verify production. If it fails, nothing has moved.
#   production  a swap, not a redeploy: the instances that just passed every check are
#               the ones that start taking traffic, already warm — and the previous
#               build lands in the slot as the rollback.
#
# Required secrets and variables are listed in docs/PIPELINE.md.

name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      channel:
        description: Which rung to deploy to.
        type: choice
        options: [dev, prerelease]
        default: dev
      skip-promotion:
        description: For a tag run — deploy and verify prerelease, but do not swap into production.
        type: boolean
        default: false

# Never cancel a deploy in flight: cancelling between a slot deploy and a swap leaves
# the two halves inconsistent with nothing to say so.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # ===========================================================================
  # RUNG 1 — dev. Every push to main, no gate.
  # ===========================================================================
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref_type != 'tag' }}
    environment:
      name: dev
      url: ${{ vars.HUB_DEV_URL }}
    permissions:
      contents: read
      id-token: write # OIDC federated login to Azure — no stored client secret
    steps:
      # The artifact built and scanned by verify, byte for byte. Rebuilding here would
      # mean deploying something that was never the thing that passed.
      - uses: actions/download-artifact@v4
        with:
          name: hub-${{ github.sha }}
          path: dist/hub

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Settings before the deploy, so new code never starts against the previous
      # configuration. HUB_CHANNEL is what the hub reports on /version, and the smoke
      # test asserts it — a slot serving the wrong channel name is a real failure mode.
      - name: Configure the dev slot
        run: |
          az webapp config appsettings set \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot dev \
            --settings \
              HUB_CHANNEL=dev \
              HUB_MODE=http \
              HUB_LOG_LEVEL=info \
              BUILD_COMMIT='${{ github.sha }}' \
              BUILD_TIMESTAMP='${{ github.event.head_commit.timestamp }}' \
              WEBSITES_PORT=8787 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none

          # startup.sh ships inside the artifact, so the start command is versioned with
          # the code it starts rather than living in a portal field nobody diffs.
          az webapp config set \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot dev \
            --startup-file 'startup.sh' \
            --output none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: dev
          package: dist/hub

      - name: Wait for dev to serve this commit
        env:
          HUB_URL: ${{ vars.HUB_DEV_URL }}
        run: |
          set -u
          for attempt in $(seq 1 40); do
            commit=$(curl -fsS --max-time 10 "$HUB_URL/version" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{process.stdout.write('')}})
            " || true)
            ready=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HUB_URL/readyz" || true)
            if [ "$commit" = "${{ github.sha }}" ] && [ "$ready" = "200" ]; then
              echo "ok  dev serves ${{ github.sha }} and reports ready"
              exit 0
            fi
            echo "attempt $attempt/40: commit=${commit:-none} readyz=${ready:-none}"
            sleep 10
          done
          echo '::error::dev never reported this commit as ready'
          curl -s --max-time 10 "$HUB_URL/readyz" || true
          exit 1

  verify-dev:
    name: Verify dev
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: dev
      url: ${{ vars.HUB_DEV_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The same tiers, against the deployed dev channel. Tier 3 is the one that matters
      # here: it proves the clients' `dev` pin still matches what dev is serving.
      - name: Tiers 2 and 3 against dev
        run: npm run e2e -- --tiers=2,3 --hub-url='${{ vars.HUB_DEV_URL }}' --channel=dev --expect-commit='${{ github.sha }}'

      # dev moves on every merge, so its pin moves with it. Committed back to main so
      # anyone pointing a client at dev gets a manifest that matches reality.
      - name: Advance the dev channel pin
        run: npm run clients:sync-pin -- --channel=dev

      - name: Commit the dev pin if it moved
        run: |
          if git diff --quiet -- packages/clients; then
            echo 'ok  the dev pin was already current; nothing to commit'
            exit 0
          fi
          git config user.name 'pivotly-ci'
          git config user.email 'ci@pivotly.com'
          git add packages/clients
          git commit \
            -m 'chore(clients): pin dev channel to the verified deploy' \
            -m 'Advanced by CD after ${{ github.sha }} passed dev verification.'
          git push origin HEAD:main

  # ===========================================================================
  # RUNG 2 — prerelease. On a version tag. Fully verified, then gated.
  # ===========================================================================
  deploy-prerelease:
    name: Deploy to the pre-release slot
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ github.ref_type == 'tag' || github.event.inputs.channel == 'prerelease' }}
    environment:
      name: prerelease
      url: ${{ vars.HUB_PRERELEASE_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hub-${{ github.sha }}
          path: dist/hub

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure the prerelease slot
        run: |
          az webapp config appsettings set \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot prerelease \
            --settings \
              HUB_CHANNEL=prerelease \
              HUB_MODE=http \
              HUB_LOG_LEVEL=info \
              BUILD_COMMIT='${{ github.sha }}' \
              BUILD_TIMESTAMP='${{ github.event.repository.updated_at }}' \
              WEBSITES_PORT=8787 \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
            --output none

          az webapp config set \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot prerelease \
            --startup-file 'startup.sh' \
            --output none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: prerelease
          package: dist/hub

      # Do not trust the deploy API's success. An instance can be up, serving the
      # previous build, and answer 200 on /healthz the whole time.
      - name: Wait for the slot to serve this commit
        env:
          HUB_URL: ${{ vars.HUB_PRERELEASE_URL }}
        run: |
          set -u
          for attempt in $(seq 1 40); do
            commit=$(curl -fsS --max-time 10 "$HUB_URL/version" | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).commit||'')}catch{process.stdout.write('')}})
            " || true)
            ready=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HUB_URL/readyz" || true)
            if [ "$commit" = "${{ github.sha }}" ] && [ "$ready" = "200" ]; then
              echo "ok  the slot serves ${{ github.sha }} and reports ready"
              exit 0
            fi
            echo "attempt $attempt/40: commit=${commit:-none} readyz=${ready:-none}"
            sleep 10
          done
          echo '::error::the pre-release slot never reported this commit as ready'
          curl -s --max-time 10 "$HUB_URL/readyz" || true
          exit 1

  # The gate. Everything below this is hard to reverse; everything above is invisible
  # to production.
  verify-prerelease:
    name: Verify the pre-release slot
    runs-on: ubuntu-latest
    needs: deploy-prerelease
    environment:
      name: prerelease
      url: ${{ vars.HUB_PRERELEASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: All three tiers against the deployed slot
        run: npm run e2e -- --hub-url='${{ vars.HUB_PRERELEASE_URL }}' --channel=prerelease --expect-commit='${{ github.sha }}'

      # The check that would have caught the original cascade: the clients' prerelease
      # pin must match what the slot serves. If it does not, promoting would put a
      # surface into production that no shipped client was generated against.
      - name: The client configs match the slot
        run: npm run clients:check -- --channel=prerelease

  # ===========================================================================
  # RUNG 3 — production. An approval, then a slot swap.
  # ===========================================================================
  promote:
    name: Swap into production
    runs-on: ubuntu-latest
    needs: verify-prerelease
    if: ${{ github.ref_type == 'tag' && github.event.inputs.skip-promotion != 'true' }}
    environment:
      # Add a required reviewer to this environment in repository settings to make
      # promotion a human decision. The gate belongs here and not earlier: everything
      # before this point is reversible without anyone noticing.
      name: production
      url: ${{ vars.HUB_PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service swaps slot settings along with the slot unless they are marked
      # sticky. So HUB_CHANNEL has to be set to `production` on the thing that is about
      # to BECOME production — otherwise production comes up reporting `prerelease`,
      # and the post-swap smoke test catches it after the fact instead of before.
      - name: Set the production channel on the slot before swapping
        run: |
          az webapp config appsettings set \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot prerelease \
            --settings HUB_CHANNEL=production \
            --output none

          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 '${{ vars.HUB_PRERELEASE_URL }}/readyz' || true)
            [ "$code" = "200" ] && { echo 'ok  the slot is ready on production settings'; break; }
            echo "attempt $attempt/30: readyz=${code:-none}"
            sleep 10
            [ "$attempt" = "30" ] && { echo '::error::the slot did not become ready on production settings'; exit 1; }
          done

      - name: Swap the slot into production
        run: |
          az webapp deployment slot swap \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot prerelease \
            --target-slot production \
            --output none
          echo 'ok  swapped; the previous production build is now in the prerelease slot'

  verify-production:
    name: Verify production
    runs-on: ubuntu-latest
    needs: promote
    environment:
      name: production
      url: ${{ vars.HUB_PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: All three tiers against production
        run: npm run e2e -- --hub-url='${{ vars.HUB_PRODUCTION_URL }}' --channel=production --expect-commit='${{ github.sha }}'

  # Runs only if production verification failed AFTER a successful swap — the one
  # situation where production is serving a build just shown to be bad. Swapping back is
  # seconds, because the previous build is still running in the slot.
  rollback:
    name: Roll back the swap
    runs-on: ubuntu-latest
    needs: [promote, verify-production]
    if: ${{ always() && needs.promote.result == 'success' && needs.verify-production.result == 'failure' }}
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Swap back
        run: |
          az webapp deployment slot swap \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name '${{ vars.AZURE_WEBAPP_NAME }}' \
            --slot prerelease \
            --target-slot production \
            --output none
          echo '::warning::production verification failed after the swap; rolled back to the previous build'

      - name: Confirm the rollback is serving
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 '${{ vars.HUB_PRODUCTION_URL }}/readyz' || true)
            [ "$code" = "200" ] && { echo 'ok  production is ready again'; exit 0; }
            sleep 5
          done
          echo '::error::production is not ready after the rollback — this needs a human'
          exit 1

  # ===========================================================================
  # The clients' half of the release. Last, deliberately: the pin records what
  # production is VERIFIED to be serving, so it can never point at a build that was
  # deployed and then rolled back.
  # ===========================================================================
  sync-clients:
    name: Sync the client configs and publish the release
    runs-on: ubuntu-latest
    needs: verify-production
    permissions:
      contents: write # to commit the pin and create the release
    steps:
      - uses: actions/checkout@v4
        with:
          # The default checkout is detached at the tag; the pin has to land on a branch
          # to be of any use to anyone.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Reads production's /version and advances the pin to the digest it is actually
      # serving, then regenerates EVERY client config from it. Refuses if that digest is
      # not the one this checkout builds, so a mid-rollout state cannot be recorded.
      - name: Advance the production pin and regenerate every client
        run: npm run clients:sync-pin -- --channel=production

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- packages/clients; then
            echo 'ok  the client configs were already current; nothing to commit'
            exit 0
          fi
          git config user.name 'pivotly-ci'
          git config user.email 'ci@pivotly.com'
          git add packages/clients
          git commit \
            -m 'chore(clients): pin production channel to the verified deploy' \
            -m 'Advanced by CD after ${{ github.sha }} passed production verification. Every client config regenerated from the pin.'
          git push origin HEAD:main

      - name: Re-verify the clients after the pin moved
        run: |
          npm run versions:verify
          npm run clients:verify
          npm run clients:check -- --channel=production

      - name: Publish the release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            The Pivotly hub is deployed and verified on the production channel, and every
            client config is pinned to the contract it is serving.

            **Claude Code**

            ```
            /plugin marketplace add ${{ github.repository }}@${{ github.ref_name }}
            /plugin install axle@pivotly
            ```

            **Codex CLI** — append `packages/clients/codex/config.toml` to `~/.codex/config.toml`.

            No token or setup is required: the hub serves two read-only greeting tools
            anonymously. To point a client at a different channel, run
            `PIVOTLY_CHANNEL=dev npm run clients:generate`.
