# .github/workflows/release.yml
#
# On a version tag. Verifies, then publishes the GitHub release.
#
# Its own workflow rather than a tag-gated job inside cd.yml, so that every job in
# every run of every workflow actually runs — see the note in cd.yml.
#
# _verify.yml is called again here rather than trusting the CI run on main. A tag is
# permanent and installable, and it may point at a commit whose CI run predates a
# change to the workflow itself. It is also passed the tag, which adds one check the
# push-to-main runs cannot make: that the tag and the repo version agree.
#
# In no-Azure mode this publishes a release and deploys nothing, so the release notes
# say so — a release that reads like a deployment when no hub was deployed is the kind
# of quiet mismatch this pipeline exists to prevent.

name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml
    with:
      tag: ${{ github.ref_name }}

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            The Axle plugin is verified and published at `${{ github.ref_name }}`.

            **Claude Code**

            ```
            /plugin marketplace add ${{ github.repository }}
            /plugin install axle@Test-Plugin
            ```

            **Codex CLI** — append `packages/clients/codex/config.toml` to `~/.codex/config.toml`.

            > Cut with the pipeline in no-Azure mode: everything was verified against a
            > hub the test suite starts itself, and no hub was deployed. The client
            > configs still point at the production channel URL, which will not answer
            > until the Azure pipeline on the `with-azure` branch is restored and run.
